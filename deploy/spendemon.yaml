apiVersion: v1
kind: ConfigMap
metadata:
  name: spendemon-settings
data:
  settings.yaml: |
    clusters:
      - name: "cluster-1"
        prometheusUrl: "http://prometheus-service.prometheus.svc.cluster.local:80"

    costs:
      cpuCore: 10
      memoryGb: 20
      storageGb: 5

    sharednamespaces:
      - "kube-system"

    oidc:
      enabled: false
      issuer: ""
      clientId: ""
      clientSecret: ""
      adminGroup: "admin"
      viewerGroup: "viewer"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendemon
  labels:
    app: spendemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spendemon
  template:
    metadata:
      labels:
        app: spendemon
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: spendemon
          image: ghcr.io/fabiotavernini/spendemon:1.1.2
          imagePullPolicy: IfNotPresent
          env:
            - name: SETTINGS_FILE_PATH
              value: /config/settings.yaml
          envFrom:
            - secretRef:
                name: spendemon-auth
                optional: true
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          volumeMounts:
            - name: settings
              mountPath: /config
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: spendemon-settings
---
apiVersion: v1
kind: Service
metadata:
  name: spendemon
  labels:
    app: spendemon
spec:
  type: ClusterIP
  selector:
    app: spendemon
  ports:
    - name: http
      port: 3000
      targetPort: 3000
